<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorfly Studio</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <img src="img/Bannerr.png" alt="ColorPops, dale vida y color a tus ideas">
    <header>
        <h1>Una experiencia creativa de Colorfly Studio. </h1>
    </header>
    <main>
        <section>
            <h2>Generador de paletas</h2>
            <div id="paletas">
                <label for="cantidadDeColores">Tamaño de paleta</label>
                <select id="cantidadDeColores">
                    <option value="6">6</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                </select>
                <button id="generarPaleta">Generar paleta</button>

                <div id="contenedorColores"></div>
                <p>Hacé clic sobre el color para copiar tu código HEX.</p>
            </div>
        </section>
    </main>

    <footer> © 2026 ColorPops — Creado por Colorfly Studio. </footer>
    <script src="./js/script.js"></script>

</body>

</html>
